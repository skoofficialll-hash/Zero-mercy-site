<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZERO MERCY — Official Organization</title>
<meta name="description" content="ZERO MERCY — community, channels, voice rooms, events and tournaments.">
<meta name="theme-color" content="#0b0c0e">
<meta name="color-scheme" content="dark light">
<meta property="og:title" content="ZERO MERCY — Official Organization">
<meta property="og:description" content="One identity. One team. One legacy.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d92637'/%3E%3Ctext x='32' y='46' font-family='Arial,Helvetica,sans-serif' font-size='42' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   ZERO MERCY — design tokens
   Neutral dark surfaces, one red accent used sparingly, 4px spacing rhythm.
   ============================================================================ */
:root{
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --display: 'Oswald', 'Inter', sans-serif;

  --bg:#0b0c0e;
  --bg-2:#101114;
  --panel:#16171b;
  --panel-2:#1b1c21;
  --panel-3:#222329;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.13);

  --text:#ecedef;
  --text-2:#9ba0a7;
  --text-3:#6a6f76;

  --accent:#d92637;
  --accent-2:#ff3b4e;
  --accent-soft:rgba(217,38,55,.13);
  --ok:#2ea043;
  --warn:#d29922;
  --gold:#d4a72c;
  --info:#3b82f6;

  --fs-xs:.6875rem; --fs-sm:.75rem; --fs-base:.8125rem; --fs-md:.875rem;
  --fs-lg:.9375rem; --fs-xl:1.0625rem; --fs-2xl:1.1875rem; --fs-3xl:1.5rem;

  --r-sm:6px; --r:8px; --r-lg:12px;
  --topbar-h:52px; --sidebar-w:212px; --bottomnav-h:56px;

  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.85);
}
[data-theme="light"]{
  --bg:#f6f7f9; --bg-2:#ffffff; --panel:#ffffff; --panel-2:#f3f4f6; --panel-3:#e9eaee;
  --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.14);
  --text:#14161a; --text-2:#5b6169; --text-3:#8b9098;
  --shadow:0 1px 2px rgba(0,0,0,.06), 0 8px 24px -14px rgba(0,0,0,.2);
  --shadow-lg:0 24px 60px -24px rgba(0,0,0,.3);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:var(--fs-base);line-height:1.55;-webkit-font-smoothing:antialiased;
  overflow:hidden;
}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.3;letter-spacing:-.01em}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
svg{width:18px;height:18px;flex-shrink:0;vertical-align:middle}
::selection{background:var(--accent);color:#fff}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.muted{color:var(--text-2)}
.dim{color:var(--text-3)}
.accent{color:var(--accent-2)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.hidden{display:none !important}

/* ---------- app shell ---------- */
.app{
  display:grid;height:100vh;height:100dvh;
  grid-template-columns:var(--sidebar-w) minmax(0,1fr);
  grid-template-rows:var(--topbar-h) minmax(0,1fr);
}
.app.collapsed{--sidebar-w:64px}

/* ---------- top bar ---------- */
.topbar{
  grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:var(--bg-2);border-bottom:1px solid var(--line);
  position:relative;z-index:60;
}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand .mark{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,#2a2c31,#141518);border:1px solid var(--line-2);
  font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--accent-2);flex-shrink:0;
}
.brand b{font-size:.84rem;font-weight:600;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{font-size:.62rem;color:var(--text-3);letter-spacing:1.4px;text-transform:uppercase}
.topnav{display:flex;align-items:center;gap:1px;margin-left:6px;overflow-x:auto;scrollbar-width:none;max-width:38vw}
.topnav::-webkit-scrollbar{display:none}
.topnav a{padding:6px 10px;border-radius:var(--r-sm);font-size:var(--fs-md);color:var(--text-2);white-space:nowrap;transition:background .12s,color .12s}
.topnav a:hover{color:var(--text);background:var(--panel)}
.topnav a.active{color:var(--text);background:var(--panel-2)}

.search{position:relative;margin-left:auto;width:min(340px,32vw);flex-shrink:1}
.search>svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);width:15px;height:15px;pointer-events:none}
.search input{
  width:100%;height:34px;padding:0 12px 0 32px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line);color:var(--text);outline:none;transition:.15s;
}
.search input::placeholder{color:var(--text-3)}
.search input:focus{border-color:var(--line-2);background:var(--panel-2)}
.results{
  position:absolute;top:calc(100% + 8px);right:0;width:min(420px,80vw);max-height:60vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  padding:6px;display:none;z-index:70;
}
.results.show{display:block}
.results .grp{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:1.2px;color:var(--text-3);padding:8px 10px 4px;font-weight:600}
.hit{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-sm);color:var(--text-2);font-size:var(--fs-md)}
.hit:hover{background:var(--panel-2);color:var(--text)}
.hit svg{width:15px;height:15px;color:var(--text-3)}
.hit .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
.icon-btn{
  width:34px;height:34px;border-radius:var(--r);display:grid;place-items:center;
  color:var(--text-2);position:relative;transition:background .12s,color .12s;
}
.icon-btn:hover{background:var(--panel);color:var(--text)}
.icon-btn svg{width:17px;height:17px}
.dot-badge{
  position:absolute;top:3px;right:3px;min-width:15px;height:15px;padding:0 4px;border-radius:99px;
  background:var(--accent);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;
  border:2px solid var(--bg-2);line-height:1;
}
.avatar{
  border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#33363d,#1c1e22);
  color:#fff;font-weight:600;font-size:var(--fs-xs);overflow:hidden;flex-shrink:0;
  border:1px solid var(--line-2);width:32px;height:32px;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:26px;height:26px;font-size:10px}
.avatar.md{width:38px;height:38px;font-size:var(--fs-sm)}
.avatar.lg{width:52px;height:52px;font-size:var(--fs-md)}
.avatar.xl{width:84px;height:84px;font-size:var(--fs-2xl);border-width:3px}
.frame-royal{box-shadow:0 0 0 2px var(--gold),0 0 14px -2px rgba(212,167,44,.5)}
.frame-crimson{box-shadow:0 0 0 2px var(--accent-2),0 0 14px -2px var(--accent-soft)}
.frame-ember{box-shadow:0 0 0 2px #ff8a4c,0 0 14px -2px rgba(255,138,76,.5)}
.frame-frost{box-shadow:0 0 0 2px #6ec1ff,0 0 14px -2px rgba(110,193,255,.5)}

.dropdown{
  position:absolute;top:calc(100% + 8px);right:0;width:300px;background:var(--panel);
  border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  padding:6px;display:none;z-index:70;max-height:70vh;overflow:auto;
}
.dropdown.show{display:block}
.dropdown h5{margin:0;padding:8px 10px;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:1.2px;color:var(--text-3)}
.dd-item{display:flex;align-items:flex-start;gap:9px;width:100%;padding:8px 10px;border-radius:var(--r-sm);color:var(--text-2);text-align:left;font-size:var(--fs-md)}
.dd-item:hover{background:var(--panel-2);color:var(--text)}
.dd-item svg{width:15px;height:15px;margin-top:2px;color:var(--text-3)}
.dd-item span{display:block;min-width:0}
.dd-item small{display:block;color:var(--text-3);font-size:var(--fs-sm);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}

/* ---------- sidebar ---------- */
.sidebar{
  grid-column:1;grid-row:2;background:var(--bg-2);border-right:1px solid var(--line);
  overflow-y:auto;overflow-x:hidden;padding:10px 8px 20px;
}
.sidebar::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:4px;border:2px solid var(--bg-2)}
.side-group{font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--text-3);padding:14px 10px 5px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:var(--r-sm);
  color:var(--text-2);font-size:var(--fs-md);transition:background .12s,color .12s;position:relative;
}
.nav-item:hover{background:var(--panel);color:var(--text)}
.nav-item.active{background:var(--panel-2);color:var(--text)}
.nav-item.active::before{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav-item svg{width:16px;height:16px;color:currentColor;opacity:.8}
.nav-item.active svg{opacity:1;color:var(--accent-2)}
.nav-item .lbl{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .tag{font-size:10px;font-weight:700;background:var(--accent);color:#fff;border-radius:99px;padding:1px 6px}
.app.collapsed .nav-item .lbl,.app.collapsed .side-group,.app.collapsed .brand-text{display:none}
.app.collapsed .nav-item{justify-content:center;padding:9px 0}
.app.collapsed .nav-item.active::before{left:-8px}

/* ---------- content ---------- */
.content{grid-column:2;grid-row:2;overflow-y:auto;overflow-x:hidden;position:relative}
.content::-webkit-scrollbar{width:10px}
.content::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:5px;border:3px solid var(--bg)}
.page{padding:18px 22px 68px;max-width:1320px;margin:0 auto;animation:fade .16s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

.page-head{margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent-2);margin-bottom:6px}
.page-head h1{font-size:var(--fs-2xl);letter-spacing:-.02em}
.page-head p{color:var(--text-2);font-size:var(--fs-md);margin-top:4px;max-width:70ch}
.section{margin-top:26px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.section-head h2{font-size:var(--fs-lg);letter-spacing:-.01em}
.section-head a{font-size:var(--fs-sm);color:var(--text-2)}
.section-head a:hover{color:var(--accent-2)}

/* ---------- primitives ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;
  border-radius:var(--r-sm);font-size:var(--fs-md);font-weight:500;transition:.13s;white-space:nowrap;
  border:1px solid transparent;
}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-2)}
.btn-ghost{background:var(--panel);color:var(--text-2);border-color:var(--line)}
.btn-ghost:hover{background:var(--panel-2);color:var(--text);border-color:var(--line-2)}
.btn-danger{background:transparent;color:var(--accent-2);border-color:rgba(217,38,55,.35)}
.btn-danger:hover{background:var(--accent-soft)}
.btn-sm{height:27px;padding:0 9px;font-size:var(--fs-sm)}
.btn-icon{width:32px;padding:0}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav-item:focus-visible,.icon-btn:focus-visible,.chip:focus-visible,
a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}

.chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:99px;
  background:var(--panel);border:1px solid var(--line);color:var(--text-2);font-size:var(--fs-sm);transition:.12s}
.chip:hover{color:var(--text);border-color:var(--line-2)}
.chip.active{background:var(--accent-soft);border-color:rgba(217,38,55,.45);color:var(--accent-2)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;letter-spacing:.4px;
  padding:2px 7px;border-radius:99px;border:1px solid var(--line-2);color:var(--text-2);white-space:nowrap}
.pill.red{background:var(--accent-soft);border-color:rgba(217,38,55,.4);color:var(--accent-2)}
.pill.gold{background:rgba(212,167,44,.13);border-color:rgba(212,167,44,.4);color:var(--gold)}
.pill.green{background:rgba(46,160,67,.13);border-color:rgba(46,160,67,.4);color:var(--ok)}
.pill.amber{background:rgba(210,153,34,.13);border-color:rgba(210,153,34,.4);color:var(--warn)}
.pill.blue{background:rgba(59,130,246,.13);border-color:rgba(59,130,246,.4);color:var(--info)}
.pill.silver{background:var(--panel-2);color:var(--text-2)}
.verified{color:var(--info);font-size:.8em}

.dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex-shrink:0;display:inline-block}
.dot.online{background:var(--ok);box-shadow:0 0 0 3px rgba(46,160,67,.18)}
.dot.offline{background:var(--text-3)}

.field{margin-bottom:14px}
.field label{display:block;font-size:var(--fs-sm);font-weight:500;color:var(--text-2);margin-bottom:6px}
.field .req{color:var(--accent-2)}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{
  width:100%;height:36px;padding:0 11px;border-radius:var(--r-sm);background:var(--panel);
  border:1px solid var(--line);color:var(--text);outline:none;transition:.14s;
}
textarea{height:auto;min-height:84px;padding:9px 11px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{border-color:var(--line-2);background:var(--panel-2)}
input:disabled{opacity:.55;cursor:not-allowed}
select{appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239ba0a7' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;background-size:14px;padding-right:30px}

/* ---------- surfaces ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card.hover{transition:.15s}
.card.hover:hover{border-color:var(--line-2);transform:translateY(-1px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.panel+.panel{margin-top:14px}
.panel h3{font-size:var(--fs-md);margin-bottom:2px}
.panel .sub{font-size:var(--fs-sm);color:var(--text-3)}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid>*{min-width:0}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.kpi b{display:block;font-family:var(--display);font-size:1.4rem;font-weight:600;line-height:1.1}
.kpi span{font-size:var(--fs-sm);color:var(--text-3);text-transform:uppercase;letter-spacing:1px}
.kpi.red b{color:var(--accent-2)} .kpi.green b{color:var(--ok)} .kpi.gold b{color:var(--gold)}

.row{display:flex;align-items:flex-start;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:13px 15px;transition:.14s}
.row.hover:hover{border-color:var(--line-2)}
.row.unread{border-color:rgba(217,38,55,.4);background:linear-gradient(180deg,var(--accent-soft),var(--panel))}
.row .thumb{width:46px;height:46px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;
  background:var(--panel-2);border:1px solid var(--line);color:var(--accent-2);font-family:var(--display);font-size:1.05rem}
.row .body{flex:1;min-width:0}
.row h4{font-size:var(--fs-md);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.row p{color:var(--text-2);font-size:var(--fs-md);margin-top:3px}
.row .meta{display:flex;gap:14px;color:var(--text-3);font-size:var(--fs-sm);margin-top:6px;flex-wrap:wrap}

.note{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:10px 13px;font-size:var(--fs-md);color:var(--text-2);margin-bottom:16px}
.note svg{color:var(--accent-2);width:16px;height:16px}
.note b{color:var(--text)}

.banner{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid rgba(217,38,55,.4);
  border-radius:var(--r);padding:10px 13px;margin-bottom:16px;font-size:var(--fs-md)}
.banner>svg{color:var(--accent-2);width:17px;height:17px;flex-shrink:0}
.banner .t{flex:1;min-width:0}
.banner b{display:block;font-size:var(--fs-md)}
.banner .s{color:var(--text-2);font-size:var(--fs-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- member card ---------- */
.member-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 12px;
  text-align:center;transition:.15s;position:relative;display:block}
.member-card:hover{border-color:var(--line-2);transform:translateY(-2px)}
.member-card .avatar{margin:0 auto 9px}
.member-card h4{font-size:var(--fs-md);justify-content:center;display:flex;align-items:center;gap:5px}
.member-card .handle{font-size:var(--fs-sm);color:var(--text-3);margin-top:1px}
.member-card .uid{font-size:var(--fs-xs);color:var(--text-3);font-family:ui-monospace,monospace;letter-spacing:.6px;margin-top:7px}
.member-card .st{font-size:var(--fs-sm);color:var(--text-3);margin-top:6px;display:flex;align-items:center;justify-content:center;gap:5px}
.member-card .mstats{display:flex;justify-content:center;gap:16px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--text-3)}
.member-card .mstats b{color:var(--text);font-weight:600}
.member-card .corner{position:absolute;top:11px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(212,167,44,.18)}

/* ---------- tables ---------- */
.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.table-wrap.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:var(--fs-md)}
th{text-align:left;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:1px;color:var(--text-3);
  font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel-2)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 13px;font-size:var(--fs-md);color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap;transition:.13s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}

/* ---------- states ---------- */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:52px 24px;border:1px dashed var(--line-2);border-radius:var(--r-lg);background:var(--panel);min-height:200px}
.state .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--panel-2);
  border:1px solid var(--line);color:var(--text-3);margin-bottom:14px}
.state .ico svg{width:22px;height:22px}
.state h3{font-size:var(--fs-lg);margin-bottom:6px}
.state p{color:var(--text-2);font-size:var(--fs-md);max-width:44ch}
.state .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.state.err{border-color:rgba(217,38,55,.35);background:linear-gradient(180deg,var(--accent-soft),var(--panel))}
.state.err .ico{color:var(--accent-2);border-color:rgba(217,38,55,.35)}
.state.perm{border-color:rgba(210,153,34,.3);background:linear-gradient(180deg,rgba(210,153,34,.07),var(--panel))}
.state.perm .ico{color:var(--warn);border-color:rgba(210,153,34,.3)}

.spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line-2);border-top-color:var(--accent-2);animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--panel) 25%,var(--panel-3) 50%,var(--panel) 75%);
  background-size:200% 100%;animation:sk 1.3s ease-in-out infinite;border-radius:var(--r-lg)}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-card{height:178px}
.sk-row{height:66px}
.sk-line{height:28px;border-radius:var(--r-sm);margin-bottom:6px}

.offline{display:flex;align-items:center;gap:9px;background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.35);
  color:#e8c06a;padding:9px 13px;border-radius:var(--r);font-size:var(--fs-md);margin-bottom:16px}
.offline svg{width:16px;height:16px;flex-shrink:0}

/* ---------- chat ---------- */
.chat-layout{display:grid;grid-template-columns:196px minmax(0,1fr) 188px;gap:12px;align-items:start}
.chat-layout>*{min-width:0}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px;
  max-height:calc(100vh - 140px);overflow-y:auto}
.rail::-webkit-scrollbar{width:7px}
.rail::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:4px}
.rail-head{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-3);padding:8px 8px 4px}
.ch-btn{display:flex;align-items:center;gap:7px;width:100%;padding:6px 8px;border-radius:var(--r-sm);
  color:var(--text-2);font-size:var(--fs-md);transition:.12s}
.ch-btn:hover{background:var(--panel-2);color:var(--text)}
.ch-btn.active{background:var(--panel-3);color:var(--text)}
.ch-btn svg{width:15px;height:15px;color:var(--text-3)}
.ch-btn.active svg{color:var(--accent-2)}
.ch-btn .lbl{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-btn .tag{font-size:10px;font-weight:700;background:var(--accent);color:#fff;border-radius:99px;padding:0 6px;min-width:16px;text-align:center}

.chat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;
  height:calc(100vh - 140px);min-width:0;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--line);min-width:0}
.chat-head h3{font-size:var(--fs-md);flex-shrink:0}
.chat-head .desc{font-size:var(--fs-sm);color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chat-tools{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.chat-tools input{height:30px;font-size:var(--fs-sm)}
.pinned{display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(210,153,34,.07);
  border-bottom:1px solid rgba(210,153,34,.22);font-size:var(--fs-sm);color:var(--text-2)}
.pinned svg{color:var(--warn);width:14px;height:14px}
.chat-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.chat-body::-webkit-scrollbar{width:8px}
.chat-body::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:4px}
.msg{display:flex;gap:10px;padding:5px 8px;border-radius:var(--r-sm);position:relative}
.msg:hover{background:var(--panel-2)}
.msg>div{min-width:0;flex:1}
.msg .who{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.msg .who b{font-size:var(--fs-md);font-weight:600}
.msg .who time{font-size:var(--fs-xs);color:var(--text-3)}
.msg .txt{color:var(--text-2);font-size:var(--fs-md);overflow-wrap:anywhere;margin-top:1px}
.msg-img{display:block;max-width:min(320px,100%);border-radius:10px;border:1px solid var(--line);margin-top:6px}
.msg .edited{font-size:var(--fs-xs);color:var(--text-3);font-style:italic}
.mstat{font-size:var(--fs-xs);color:var(--text-3)}
.mstat.sending{color:var(--text-3)} .mstat.sent{color:var(--ok)} .mstat.failed{color:var(--accent-2)}
.msg-acts{display:flex;gap:4px;margin-top:5px;opacity:0;transition:opacity .12s}
.msg:hover .msg-acts,.msg:focus-within .msg-acts{opacity:1}
@media(hover:none){.msg-acts{opacity:1}}
.ma{font-size:var(--fs-xs);padding:2px 7px;border-radius:5px;background:var(--panel-3);color:var(--text-2);border:1px solid var(--line)}
.ma:hover{color:var(--text);border-color:var(--line-2)}
.ma.primary{background:var(--accent);color:#fff;border-color:transparent}
.composer{border-top:1px solid var(--line);padding:11px 14px;display:flex;gap:9px}
.composer input{flex:1}

/* ---------- voice ---------- */
.voice-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px;transition:.15s}
.voice-card:hover{border-color:var(--line-2)}
.voice-card h4{font-size:var(--fs-md);display:flex;align-items:center;gap:7px}
.voice-card p{font-size:var(--fs-sm);color:var(--text-2);margin-top:4px}
.voice-card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.voice-card .count{font-size:var(--fs-sm);color:var(--text-3)}
.room{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.room-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.room-head h3{font-size:var(--fs-lg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.tile{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 8px;text-align:center;position:relative;transition:.2s}
.tile.speaking{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok),0 0 18px -6px var(--ok)}
.tile .nm{font-size:var(--fs-sm);margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tagline{font-size:10px;color:var(--text-3);margin-top:2px}
.meter{height:5px;background:var(--panel-3);border-radius:3px;overflow:hidden;flex:1}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .1s}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.vc{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:66px;padding:9px 10px;border-radius:var(--r);
  background:var(--panel-2);border:1px solid var(--line);color:var(--text-2);font-size:var(--fs-xs);transition:.13s}
.vc:hover{color:var(--text);border-color:var(--line-2)}
.vc.on{background:var(--accent-soft);border-color:rgba(217,38,55,.45);color:var(--accent-2)}
.vc.danger{color:var(--accent-2)}
.vc:disabled{opacity:.4;cursor:not-allowed}
.vc svg{width:17px;height:17px}

/* ---------- events ---------- */
.event{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;transition:.15s;display:block}
.event:hover{border-color:var(--line-2);transform:translateY(-2px)}
.event .cover{height:104px;position:relative;display:grid;place-items:center;overflow:hidden}
.event .cover .zm{font-family:var(--display);font-size:1.05rem;letter-spacing:4px;color:rgba(255,255,255,.13)}
.event .cover .st{position:absolute;top:9px;left:9px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;
  background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(4px)}
.event .cover .st.up{color:#ffb3bb;border-color:rgba(255,59,78,.5)}
.event .cover .st.live{color:#0b0c0e;background:#2ea043;border-color:rgba(46,160,67,.75)}
.event .cover .st.done{color:#c9cdd3}
.ev-timer{display:flex;align-items:center;gap:5px;font-size:var(--fs-xs);color:var(--text-3);margin-top:6px}
.ev-timer.live{color:var(--ok)} .ev-timer.up{color:var(--accent-2)} .ev-timer.cancel{color:var(--warn)}
.ev-timer svg{width:12px;height:12px}
.ev-schedule{margin-top:6px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ev-row{display:flex;justify-content:space-between;gap:14px;padding:9px 13px;border-bottom:1px solid var(--line);font-size:var(--fs-md)}
.ev-row:last-child{border-bottom:0}
.ev-row .k{color:var(--text-3);display:flex;align-items:center;gap:6px}
.ev-row .k svg{width:14px;height:14px}
.ev-count{font-size:var(--fs-sm);color:var(--text-3);font-weight:400}
.event .cover .st.done{color:#9fe0b0;border-color:rgba(46,160,67,.45)}
.event .cover .st.cancel{color:#ffb3bb;border-color:rgba(217,38,55,.6)}
.event .cover .st.full{color:#e8c06a;border-color:rgba(210,153,34,.5)}
.event .cover .place{position:absolute;top:9px;right:9px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;
  background:rgba(0,0,0,.6);border:1px solid rgba(212,167,44,.5);color:var(--gold);backdrop-filter:blur(4px)}
.event .cover .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.25);opacity:0;transition:.18s}
.event:hover .cover .play{opacity:1}
.event .cover .play span{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(217,38,55,.95);color:#fff}
.event .eb{padding:13px 14px}
.event .eb h4{font-size:var(--fs-md)}
.event .eb .meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--text-3);font-size:var(--fs-sm);margin-top:6px}
.event .eb .links{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}

/* ---------- profile ---------- */
.cover{height:150px;border-radius:var(--r-lg) var(--r-lg) 0 0;position:relative;overflow:hidden}
.pf-card{padding:0;overflow:hidden}
.pf-cover{height:148px;position:relative}
.pf-bar{position:absolute;inset:0 0 auto;display:flex;align-items:center;gap:6px;padding:9px 11px;
  background:linear-gradient(rgba(4,5,7,.62),transparent)}
.pf-bar b{flex:1;font-size:var(--fs-md);font-weight:600;color:#fff}
.pf-bar .btn-icon{color:#fff}
.pf-head{display:flex;gap:15px;align-items:flex-start;padding:0 20px;margin-top:-44px;position:relative}
.pf-head .avatar{border:4px solid var(--panel);border-radius:50%;flex-shrink:0}
.pf-id{flex:1;min-width:0;padding-top:46px}
.pf-id h1{font-size:var(--fs-2xl);letter-spacing:-.01em;line-height:1.15;overflow-wrap:anywhere}
.pf-handle{color:var(--accent-2);font-size:var(--fs-md);margin-top:2px}
.pf-uid{color:var(--text-3);font-size:var(--fs-sm);margin-top:3px}
.pf-verified{color:var(--accent-2);font-size:1.05rem;padding-top:48px}
.pf-chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 20px 0}
.pf-online{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--text-2)}
.pf-bio{padding:10px 20px 0;color:var(--text-2);font-size:var(--fs-md)}
.pf-links{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px 0}
.pf-actions{display:flex;gap:10px;padding:16px 20px 0;flex-wrap:wrap}
.pf-actions .btn{flex:1;min-width:132px;justify-content:center}
.pf-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pf-stat{padding:14px 8px;text-align:center;border-right:1px solid var(--line)}
.pf-stat:last-child{border-right:0}
.pf-stat b{display:block;font-family:var(--display);font-size:1.25rem;line-height:1.1}
.pf-stat span{font-size:var(--fs-sm);color:var(--text-3)}
.pf-tabs{padding:0 20px;margin:0;border-bottom:1px solid var(--line)}
.pf-tabs .tab{border-radius:0;padding:12px 4px;margin-right:18px}
.pf-body{padding:16px 20px 20px}
.pf-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);color:inherit}
.pf-row:last-child{border-bottom:0}
a.pf-row:hover .pf-row-b b{color:var(--accent-2)}
.pf-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
  background:var(--panel-2);border:1px solid var(--line);color:var(--text-3)}
.pf-ico svg{width:17px;height:17px}
.pf-row-b{flex:1;min-width:0}
.pf-row-b b{display:block;font-size:var(--fs-md);font-weight:500}
.pf-row-b span{display:block;font-size:var(--fs-sm);color:var(--text-3);overflow-wrap:anywhere}
.pf-row .chev{color:var(--text-3);flex-shrink:0}
.pf-row .chev svg{width:16px;height:16px}
.pf-badge{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:1.05rem;
  background:var(--panel-2);border:1px solid var(--line)}
.profile-head{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r-lg) var(--r-lg);padding:0 20px 20px}
.profile-head .av{margin-top:-42px;border:4px solid var(--panel)}
.profile-head h1{font-size:var(--fs-2xl);margin-top:10px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.profile-head .handle{color:var(--text-3);font-size:var(--fs-md);margin-top:2px}
.profile-head .facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:var(--fs-md);color:var(--text-2)}
.profile-head .facts b{color:var(--text);font-weight:600}

/* ---------- shop (compact, premium) ---------- */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:9px}
.shop{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:10px 12px;transition:.15s}
.shop:hover{border-color:var(--line-2);background:var(--panel-2)}
.shop .prev{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem;flex-shrink:0;
  background:linear-gradient(150deg,#241014,#131013);border:1px solid var(--line)}
.shop .info{flex:1;min-width:0}
.shop .info h4{font-size:var(--fs-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop .info p{font-size:var(--fs-sm);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.shop .buy{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.shop .price{font-size:var(--fs-md);font-weight:600;color:var(--accent-2);white-space:nowrap}
.shop.owned{border-color:rgba(46,160,67,.3)}
.shop.owned .price{color:var(--ok)}

/* ---------- people rows (compact horizontal, used everywhere) ---------- */
.people-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px}
.person{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:var(--r-sm);transition:background .12s;min-width:0}
.person:hover{background:var(--panel-2)}
.person .p-main{flex:1;min-width:0}
.person .p-name{display:flex;align-items:center;gap:5px;font-size:var(--fs-md);font-weight:500;white-space:nowrap;overflow:hidden}
.person .p-name .nm{overflow:hidden;text-overflow:ellipsis}
.person .p-sub{font-size:var(--fs-sm);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .p-right{display:flex;align-items:center;gap:8px;flex-shrink:0;font-size:var(--fs-sm);color:var(--text-3)}
@media(max-width:900px){.people-grid{grid-template-columns:1fr}}

/* ---------- misc ---------- */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:18px}
.tl-item::before{content:"";position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;
  background:var(--panel);border:2px solid var(--line-2)}
.tl-item.now::before{border-color:var(--accent);background:var(--accent)}
.tl-item h4{font-size:var(--fs-md)}
.tl-item p{font-size:var(--fs-sm);color:var(--text-2);margin-top:2px}
.tl-item .when{font-size:var(--fs-xs);color:var(--text-3);margin-top:3px}

.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:8px;overflow:hidden}
.acc-head{display:flex;align-items:center;gap:11px;width:100%;padding:13px 15px;text-align:left}
.acc-head:hover{background:var(--panel-2)}
.acc-head .n{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--panel-3);
  font-size:var(--fs-xs);font-weight:700;color:var(--text-2);flex-shrink:0}
.acc-head h4{font-size:var(--fs-md);flex:1}
.acc-head p{font-size:var(--fs-sm);color:var(--text-3);margin-top:1px}
.acc-head svg{color:var(--text-3);transition:transform .18s}
.acc.open .acc-head svg{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .22s ease}
.acc-body .in{padding:0 15px 15px 48px;color:var(--text-2);font-size:var(--fs-md)}
.acc-body ul{margin:0;padding-left:18px}
.acc-body li{margin-bottom:6px}

/* ---------- direct messages (bubbles) ---------- */
.dm-layout{display:grid;grid-template-columns:236px minmax(0,1fr);gap:14px;align-items:start}
.dm-layout>*{min-width:0}
.dm-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;
  flex-direction:column;height:min(600px,72vh);min-width:0;overflow:hidden}
.dm-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
.dm-head b{font-size:var(--fs-md);display:block;line-height:1.2}
.dm-head .dim{font-size:var(--fs-sm)}
.dm-stream{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:9px}
.dm-stream::-webkit-scrollbar{width:8px}
.dm-stream::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:4px}
.dm-msg{display:flex;gap:8px;align-items:flex-end;max-width:80%}
.dm-msg.me{margin-left:auto;flex-direction:row-reverse}
.dm-bubble{background:var(--panel-2);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;min-width:0}
.dm-msg.me .dm-bubble{background:var(--accent);border-color:transparent;border-radius:14px 14px 4px 14px;color:#fff}
.dm-text{font-size:var(--fs-md);overflow-wrap:anywhere;line-height:1.5}
.dm-bubble time{display:block;font-size:10px;opacity:.65;margin-top:3px;text-align:right}
@media(max-width:1000px){.dm-layout{grid-template-columns:1fr}.dm-panel{height:min(70vh,560px)}}

/* ---------- full-screen channel view: the chat fills the space exactly ---------- */
#content.chat-full{display:flex;flex-direction:column;overflow:hidden;padding-bottom:16px}
#content.chat-full>.banner,#content.chat-full>.offline{flex-shrink:0}
#content.chat-full>.page{flex:1;min-height:0;width:100%;padding:16px 22px 0;display:flex;flex-direction:column}
#content.chat-full .chat-layout{flex:1;min-height:0;align-items:stretch;grid-template-rows:minmax(0,1fr)}
#content.chat-full .chat-layout>.chat-wrap{display:flex;flex-direction:column;min-height:0}
#content.chat-full .chat{height:100%;min-height:0}
#content.chat-full .chat-body{flex:1;min-height:0}
@media(max-width:1000px){
  #content.chat-full{padding:0 0 calc(var(--bottomnav-h) + env(safe-area-inset-bottom))}
  #content.chat-full>.page{padding:0}
  #content.chat-full .page-head{display:none}
  #content.chat-full .chat-layout{gap:0}
  #content.chat-full .chat{border-radius:0;border-left:0;border-right:0}
  .sidebar{padding-bottom:calc(var(--bottomnav-h) + 30px)}
  .toasts{bottom:calc(var(--bottomnav-h) + 74px);left:12px;right:12px;align-items:stretch}
}

/* ---------- profile links + uploads ---------- */
.link-list{display:grid;gap:8px}
.link-row{display:flex;align-items:center;gap:9px}
.link-row .k{width:88px;flex-shrink:0;font-size:var(--fs-sm);color:var(--text-2)}
.link-chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-sm);padding:3px 9px;border-radius:99px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--text-2)}
.link-chip:hover{color:var(--accent-2);border-color:rgba(217,38,55,.4)}
.decor-group{padding:10px 0;border-bottom:1px solid var(--line)}
.decor-label{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:1.2px;color:var(--text-3);margin-bottom:8px}
.chip.locked{opacity:.5;cursor:not-allowed}
.chip.locked:hover{border-color:var(--line);color:var(--text-3)}
.typing{font-size:var(--fs-sm);color:var(--accent-2);font-style:italic}
.upload-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.upload-prev{width:52px;height:52px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);
  display:grid;place-items:center;overflow:hidden;flex-shrink:0}
.upload-prev img{width:100%;height:100%;object-fit:cover}
.upload-prev.wide{width:112px;height:52px}

/* ---------- modal / sheet / toasts ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(5,6,8,.72);backdrop-filter:blur(3px);z-index:200;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  width:min(520px,100%);max-height:88vh;overflow:auto;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.98) translateY(6px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:var(--fs-lg)}
.modal-body{padding:18px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}


.toasts{position:fixed;bottom:18px;right:18px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 14px;
  font-size:var(--fs-md);box-shadow:var(--shadow-lg);max-width:340px;animation:slidein .18s ease-out}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.toast.ok{border-color:rgba(46,160,67,.45)}
.toast.bad{border-color:rgba(217,38,55,.5)}

/* ---------- bottom nav ---------- */
.bottomnav{display:none}
@media(max-width:1000px){
  .app{grid-template-columns:1fr}
  .sidebar{
    position:fixed;top:var(--topbar-h);bottom:0;left:0;width:270px;z-index:150;
    transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow-lg);

  .app.drawer .sidebar{transform:none}
  .content{grid-column:1;padding-bottom:var(--bottomnav-h)}
  .page{padding:16px 14px 30px}
  .topnav{display:none}
  .search{width:auto;flex:1;max-width:none}
  .kpis,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bottomnav{
    display:flex;position:fixed;bottom:0;left:0;right:0;height:calc(var(--bottomnav-h) + env(safe-area-inset-bottom));

  }
  .bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--text-3);font-size:10px;font-weight:500}
  .bn svg{width:20px;height:20px}
  .bn.active{color:var(--accent-2)}
  /* mobile master-detail: channel list first, then the chat full width */
  .chat-layout{grid-template-columns:1fr}

  .chat-layout.mobile-list .rail.members{display:none}
  .chat-layout.mobile-chat .rail.channels{display:none}

  .drawer-bg{position:fixed;inset:var(--topbar-h) 0 0;background:rgba(0,0,0,.5);z-index:140;display:none}
  .app.drawer .drawer-bg{display:block}
  .table-wrap.scroll table{min-width:560px}
  .toasts{bottom:calc(var(--bottomnav-h) + 14px);left:14px;right:14px;align-items:stretch}
}
@media(max-width:640px){

  .actions .hide-sm{display:none}
}
.hide-lg{display:none}
@media(max-width:1000px){.hide-lg{display:inline-flex}}

const fmtTime=d=>{const x=new Date(d);return isNaN(x)?'':x.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});};
const timeAgo=d=>{const s=(Date.now()-new Date(d))/1000;if(isNaN(s))return'—';
  if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';
  if(s<604800)return Math.floor(s/86400)+'d ago';return fmtDate(d);};

/* password hashing — demo only; production uses Supabase Auth */
async function hashPw(pw){
  const data=new TextEncoder().encode('zm::'+pw);
  if(window.crypto&&crypto.subtle){try{const d=await crypto.subtle.digest('SHA-256',data);
    return 'sha256:'+[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');}catch(e){}}
  let h=2166136261;for(const b of data){h^=b;h=Math.imul(h,16777619)>>>0;}return 'fnv:'+h.toString(16);
}
const RL={};
function rateLimit(key,hit,reset){
  const now=Date.now();if(reset){RL[key]={n:0,until:0};return{blocked:false};}
  const s=RL[key]||(RL[key]={n:0,until:0});
  if(s.until&&now<s.until)return{blocked:true,retry:Math.ceil((s.until-now)/1000)};
  if(hit){s.n++;if(s.n>=5){s.until=now+30000;s.n=0;return{blocked:true,retry:30};}}
  return{blocked:false};
}

/* ============================================================================
   CLEANUP ALGORITHM  (TTL per data type)
   Expired items are hidden immediately in the UI and removed later by a
   background cleanup — a TTL sweep never fires on the exact second.
   ============================================================================ */
const TTL={
  channelMsgs : 48*3600*1000,   /* 48 hours  */
  dms         : 7*86400000,     /* 7 days    */
  notifRead   : 24*3600*1000,   /* 24 hours  */
  notifUnread : 3*86400000,     /* 3 days    */
  requests    : 7*86400000,     /* 7 days    */
  typing      : 10*1000,        /* 10 seconds*/
  presence    : 2*60*1000,      /* 2 minutes */
  eventRecords: 30*86400000,    /* 30 days — only events that have ENDED */
};
const TTL_LABEL={
  channelMsgs:'48 hours', dms:'7 days', notifRead:'24 hours', notifUnread:'3 days',
  requests:'7 days', typing:'10 seconds', presence:'2 minutes', eventRecords:'30 days after an event ends',
};
const agoMs=at=>Date.now()-new Date(at).getTime();
const isExpired=(at,ms)=>agoMs(at)>ms;
/* hide first, delete later */
const liveMsgs=(arr,ms)=>(arr||[]).filter(m=>!isExpired(m.at,ms));
const liveNotifs=uid=>DB.notifications.filter(n=>n.user_id===uid&&!isExpired(n.created_at,n.read?TTL.notifRead:TTL.notifUnread));
const liveRequests=uid=>DB.frequests.filter(r=>r.to===uid&&r.status==='pending'&&!isExpired(r.at,TTL.requests));
const liveOutgoing=uid=>DB.frequests.filter(r=>r.from===uid&&r.status==='pending'&&!isExpired(r.at,TTL.requests));

/* one pass, small and cheap — safe to call often */
function cleanupPass(){
  let removed=0;
  Object.keys(DB.messages).forEach(cid=>{
    const b=(DB.messages[cid]||[]).length;
    DB.messages[cid]=(DB.messages[cid]||[]).filter(m=>!isExpired(m.at,TTL.channelMsgs));
    removed+=b-DB.messages[cid].length;                 /* images ride along inside the message */
  });
  DB.dms.forEach(d=>{
    const b=d.msgs.length;
    d.msgs=d.msgs.filter(m=>!isExpired(m.at,TTL.dms));
    removed+=b-d.msgs.length;
  });
  const bn=DB.notifications.length;
  DB.notifications=DB.notifications.filter(n=>!isExpired(n.created_at,n.read?TTL.notifRead:TTL.notifUnread));
  removed+=bn-DB.notifications.length;
  const br=DB.frequests.length;
  DB.frequests=DB.frequests.filter(r=>r.status!=='pending'||!isExpired(r.at,TTL.requests));
  removed+=br-DB.frequests.length;
  Object.keys(DB.typing||{}).forEach(c=>{if(isExpired(DB.typing[c].at,TTL.typing))delete DB.typing[c];});
  const bev=DB.events.length;
  DB.events=DB.events.filter(e=>!evRecordClosed(e));
  removed+=bev-DB.events.length;
  if(removed)save();
  return removed;
}
/* background, idle-time only, so the UI never stutters */
const idleRun=cb=>(window.requestIdleCallback?window.requestIdleCallback(cb,{timeout:2000}):setTimeout(cb,80));
let cleanupBusy=false;
function backgroundCleanup(){
  if(cleanupBusy)return;
  cleanupBusy=true;
  idleRun(()=>{
    const n=cleanupPass();
    cleanupBusy=false;
    if(n)softRefresh();
  });
}
function softRefresh(){
  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;   /* never interrupt typing */
  render();
}
/* ---- presence: online expires after 2 minutes without a heartbeat ---- */
let presenceThrottle=0;
function touchPresence(){
  const u=me();if(!u)return;
  const now=Date.now();
  if(now-presenceThrottle<10000)return;
  presenceThrottle=now;
  DB.lastSeen[u.id]=now;save();
}
function isOnline(m){
  if(!m)return false;
  const u=me();
  if(u&&m.id===u.id)return true;            /* you stay online while the app is open */
  return (Date.now()-(DB.lastSeen[m.id]||0))<TTL.presence;
}
function seedPresence(){
  DB.lastSeen=DB.lastSeen||{};
  DB.members.forEach(m=>{if(m.status==='online')DB.lastSeen[m.id]=Date.now();});
  save();
}
/* ---- typing: expires after 10 seconds ---- */
function markTyping(chId){
  const u=me();if(!u)return;
  DB.typing[chId]={user:u.username,at:new Date().toISOString()};
}
function typingLabel(ch){
  const t=(DB.typing||{})[ch.id];
  const u=me();
  if(!t||isExpired(t.at,TTL.typing))return '';
  if(u&&t.user===u.username)return '';
  return `<span class="typing">${esc(t.user)} is typing…</span>`;
}

/* image picker with type + size validation */
function pickImage(maxKB,cb){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange=()=>{const f=inp.files&&inp.files[0];
    if(!f){inp.remove();return;}
    if(!/^image\//.test(f.type)){toast('Please choose an image file','bad');inp.remove();return;}
    if(f.size>maxKB*1024){toast('Image is too large — max '+maxKB+' KB','bad');inp.remove();return;}
    const r=new FileReader();
    r.onload=()=>{cb(r.result);inp.remove();};
    r.onerror=()=>{toast('Could not read that file','bad');inp.remove();};
    r.readAsDataURL(f);};
  inp.click();
}

/* ---- events: start/end times, live phase, countdown ---- */
const EVENT_DURATION=3*3600*1000;
const eventStart=e=>{const d=e.starts_at?new Date(e.starts_at):new Date(String(e.date)+'T18:00:00');return isNaN(d)?new Date(e.date):d;};
const eventEnd=e=>{const d=e.ends_at?new Date(e.ends_at):new Date(eventStart(e).getTime()+EVENT_DURATION);return isNaN(d)?eventStart(e):d;};
function evPhase(e){
  if(e.status==='cancelled')return 'cancelled';
  const now=Date.now();
  if(now<eventStart(e).getTime())return 'upcoming';
  if(now<eventEnd(e).getTime())return 'live';
  return 'ended';
}
const evRecordClosed=e=>{const ph=evPhase(e);return (ph==='ended'||ph==='cancelled')&&isExpired(eventEnd(e).toISOString(),TTL.eventRecords);};
const liveEvents=()=>DB.events.filter(e=>!evRecordClosed(e));
function durShort(ms){
  if(ms<0)ms=0;
  const m=Math.floor(ms/60000),d=Math.floor(m/1440),h=Math.floor((m%1440)/60),mm=m%60;
  if(d)return d+'d '+(h?h+'h':'');
  if(h)return h+'h '+(mm?mm+'m':'');
  if(m)return m+'m';
  return Math.floor(ms/1000)+'s';
}
function evCountdown(e){
  const ph=evPhase(e),now=Date.now();
  if(ph==='cancelled')return 'Cancelled';
  if(ph==='upcoming'){const ms=eventStart(e).getTime()-now;return ms<=0?'starting now':'starts in '+durShort(ms);}
  if(ph==='live')return 'ends in '+durShort(eventEnd(e).getTime()-now);
  return 'ended '+durShort(now-eventEnd(e).getTime())+' ago';
}
const can=p=>{const u=me();return !!(u&&PERMS[u.role]&&PERMS[u.role][p]);};
const rolePill=r=>{const t={'Founder':'red','Co-Founder':'red','Leader':'gold','Co-Leader':'gold','Administrator':'blue','Moderator':'green','Elite Member':'amber','Member':'silver'}[r]||'silver';
  return `<span class="pill ${t}">${esc(r)}</span>`;};
const avatar=(m,size='')=>`<span class="avatar ${size}${m&&m.frame?' frame-'+esc(m.frame):''}">${m&&m.avatar?`<img src="${esc(m.avatar)}" alt="">`:initials(m?m.username:'?')}</span>`;
function chVisible(c){
  if(!c)return false;
  if(c.archived)return can('manageCh');
  const u=me();
  switch(c.privacy){
    case 'public': return true;
    case 'role':   return !!(u&&(c.roles||[]).includes(u.role));
    case 'private':return can('manageCh');
    default:       return false;   // default-deny
  }
}

/* role assignment is rank-gated: you may only grant roles below your own */
function assignableRoles(){
  const u=me();if(!u)return [];
  const myRank=ROLES[u.role].rank;
  return Object.keys(ROLES).filter(r=>ROLES[r].rank>myRank);
}

/* ---- global search: members · channels · messages · events · announcements ---- */
function doSearch(q){
  const box=$('#results');
  if(!q){box.classList.remove('show');box.innerHTML='';return;}
  const ql=q.toLowerCase();
  const mem=DB.members.filter(m=>m.username.toLowerCase().includes(ql)||m.uid.toLowerCase().includes(ql)).slice(0,4);
  const ch=DB.channels.filter(c=>!c.archived&&chVisible(c)&&c.name.toLowerCase().includes(ql)).slice(0,4);
  const evs=DB.events.filter(e=>e.title.toLowerCase().includes(ql)).slice(0,3);
  const nw=DB.news.filter(n=>n.title.toLowerCase().includes(ql)).slice(0,3);
  const msgs=[];
  Object.keys(DB.messages).forEach(cid=>{
    const c=DB.channels.find(x=>x.id===cid);
    if(!chVisible(c))return;
    (DB.messages[cid]||[]).forEach(m=>{if(!m.deleted&&m.text.toLowerCase().includes(ql))msgs.push({m,c});});
  });
  const chName=id=>(DB.channels.find(c=>c.id===id)||{}).name||id;
  let html='';
  if(mem.length)html+=`<div class="grp">Members</div>`+mem.map(m=>`<a class="hit" href="#/members/${encodeURIComponent(m.username)}">${avatar(m,'sm')}<span class="t">${esc(m.username)} <span class="dim">· ${esc(m.role)}</span></span></a>`).join('');
  if(ch.length)html+=`<div class="grp">Channels</div>`+ch.map(c=>`<a class="hit" href="#/channels/${encodeURIComponent(c.name)}">${ico(c.type==='voice'?'voice':'channels')}<span class="t">${esc(c.name)} <span class="dim">· ${esc(c.category)}</span></span></a>`).join('');
  if(msgs.length)html+=`<div class="grp">Messages</div>`+msgs.slice(0,4).map(({m,c})=>`<a class="hit" href="#/channels/${encodeURIComponent(c.name)}">${ico('message')}<span class="t">${esc(m.text.slice(0,54))} <span class="dim">· #${esc(c.name)}</span></span></a>`).join('');
  if(evs.length)html+=`<div class="grp">Events</div>`+evs.map(e=>`<a class="hit" href="#/events/${slugify(e.title)}">${ico('events')}<span class="t">${esc(e.title)} <span class="dim">· ${fmtDate(e.date)}</span></span></a>`).join('');
  if(nw.length)html+=`<div class="grp">Announcements</div>`+nw.map(n=>`<a class="hit" href="#/news/${slugify(n.title)}">${ico('news')}<span class="t">${esc(n.title)}</span></a>`).join('');
  box.innerHTML=html||`<div style="padding:14px;color:var(--text-3);font-size:var(--fs-md)">No results for “${esc(q)}”.</div>`;
  box.classList.add('show');
  $$('.hit',box).forEach(a=>a.onclick=()=>box.classList.remove('show'));
}

function wireEvents(){
  wireActs({events:()=>go('events')});
  $$('[data-ef]').forEach(b=>b.onclick=()=>{EF=b.dataset.ef;render();});
  const ne=$('#newEvent');if(ne)ne.onclick=eventCreateModal;
  const u=me();
  const ev=PARAM?DB.events.find(e=>slugify(e.title)===PARAM):null;
  if(ev&&u){
    const rb=$('#evRemind');
    if(rb)rb.onclick=()=>{ev.reminders=ev.reminders||[];const i=ev.reminders.indexOf(u.id);
      if(i>=0)ev.reminders.splice(i,1);else ev.reminders.push(u.id);save();
      toast(i>=0?'Reminder removed':'Reminder set','ok');render();};
    if(PARAM){
    const ev2=DB.events.find(e=>slugify(e.title)===PARAM);
    if(ev2&&$('#evTimer')){
      if(EV_TICK)clearInterval(EV_TICK);
      EV_TICK=setInterval(()=>{
        const el=document.getElementById('evTimer');
        if(!el){clearInterval(EV_TICK);EV_TICK=null;return;}
        const cur=DB.events.find(e=>slugify(e.title)===PARAM);
        if(cur)el.textContent=evCountdown(cur);
      },1000);
    }
  }
  const rg=$('#evRegister');
    if(rg)rg.onclick=()=>{ev.participants=ev.participants||[];
      if(!ev.participants.includes(u.id)){ev.participants.push(u.id);
        DB.notifications.push({id:Date.now(),user_id:u.id,title:'Registered for '+ev.title,body:'You are on the participant list.',read:0,created_at:new Date().toISOString()});
        save();toast('Registered for '+ev.title,'ok');render();}};
  }
}

function vChannels(){

  const active=(wanted&&chVisible(wanted))?wanted.id:(CHAN&&DB.channels.find(c=>c.id===CHAN)?CHAN:(list[0]&&list[0].id));
  CHAN=active;
  const ch=DB.channels.find(c=>c.id===active);
  const all=liveMsgs(ch?DB.messages[ch.id]:[],TTL.channelMsgs);
  const msgs=all.filter(m=>!m.deleted||can('moderate'));
  const pinned=msgs.filter(m=>m.pinned);
  const reads=(u&&DB.reads[u.id])||{};
  const unreadOf=c=>{if(!u)return 0;const last=reads[c.id];
    return liveMsgs(DB.messages[c.id],TTL.channelMsgs).filter(m=>!m.deleted&&m.user!==u.username&&(!last||new Date(m.at)>new Date(last))).length;};

  const online=DB.members.filter(isOnline).sort((a,b)=>ROLES[a.role].rank-ROLES[b.role].rank);

  const mItem=(m,off)=>`<a class="nav-item" href="#/members/${encodeURIComponent(m.username)}"${off?' style="opacity:.55"':''}>
      ${avatar(m,'sm')}<span class="lbl">${esc(m.username)}</span>
      <span class="dim" style="font-size:10px;text-transform:uppercase;letter-spacing:.5px">${esc(m.role.split(' ')[0])}</span></a>`;
  const memRail=`<div class="rail members">
    <div class="rail-head" style="display:flex;align-items:center;gap:6px"><span class="dot online"></span>Online — ${online.length}</div>

    ${offline.map(m=>mItem(m,true)).join('')}
  </div>`;

  let chat;
  if(!list.length){
    chat=`<div class="chat">${stateBlock('empty',{title:'No channels available',msg:u?'You do not have access to any text channels yet.':'Sign in to see members-only channels.',actions:u?[{label:'Go home',act:'home'}]:[{label:'Sign in',act:'login',primary:1}]})}</div>`;
  } else if(!ch){
    chat=`<div class="chat">${stateBlock('empty',{title:'Pick a channel',msg:'Choose a channel from the list to start reading.'})}</div>`;

    chat=`<div class="chat">
      <div class="chat-head">
        <button class="btn btn-icon btn-ghost hide-lg" id="chBack" aria-label="Back to channels">${ico('left')}</button>
        <h3>${ch.privacy!=='public'?'🔒 ':''}#${esc(ch.name)}</h3>

        <span class="desc">${esc(ch.desc||'')}</span>

      catch(e){openModal(`<div class="modal-head"><h3>Invite link</h3><button class="btn btn-icon btn-ghost" onclick="closeModal()">${ico('x')}</button></div>

        const s=$('#invSel');if(s)s.onclick=()=>$('#inviteUrl').select();}

function setMute(muted){
  VMUTE=muted?1:0;
  if(MIC_STREAM)MIC_STREAM.getAudioTracks().forEach(t=>{t.enabled=!muted;});
  const st=DB.voice[VOICE];const u=me();
  if(st&&u){st.muted=st.muted||[];st.muted=muted?[...new Set(st.muted.concat(u.id))]:st.muted.filter(x=>x!==u.id);}
  save();render();
}
async function joinVoice(id){
  const u=me();
  if(!u){toast('Sign in to join voice rooms','bad');go('login');return;}
  const ch=DB.channels.find(c=>c.id===id);if(!ch)return;
  if(!chVisible(ch)){toast('You do not have access to this room','bad');return;}
  const st=DB.voice[id]||(DB.voice[id]={members:[],speaking:[],locked:false,hands:[],muted:[]});
  if(st.locked&&!can('manageCh')){toast('This room is locked','bad');return;}
  if(st.members.length>=ch.limit){toast('Room is full','bad');return;}
  if(VOICE)leaveVoice(true);
  VOICE=id;VOICE_ERR=null;VOICE_STATE='joining';go('voice');render();
  VOICE_STATE='permission';render();
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Object.assign(new Error('x'),{name:'NotSupportedError'});
    MIC_STREAM=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  }catch(err){
    VOICE_STATE='failed';
    VOICE_ERR=(err&&err.name==='NotAllowedError')?{kind:'permission',msg:'Microphone permission was denied.'}
      :(err&&(err.name==='NotFoundError'||err.name==='DevicesNotFoundError'))?{kind:'no-device',msg:'No microphone device was found.'}
      :(err&&err.name==='NotSupportedError')?{kind:'error',msg:'This browser does not support microphone capture.'}
      :{kind:'error',msg:'Could not start the microphone.'};
    MIC_STREAM=null;render();return;
  }
  try{
    AUDIO_CTX=new (window.AudioContext||window.webkitAudioContext)();
    const src=AUDIO_CTX.createMediaStreamSource(MIC_STREAM);
    MIC_ANALYSER=AUDIO_CTX.createAnalyser();MIC_ANALYSER.fftSize=512;src.connect(MIC_ANALYSER);
    MIC_RAF=requestAnimationFrame(tickLevel);
  }catch(e){MIC_ANALYSER=null;}
  if(!st.members.includes(u.id))st.members.push(u.id);
  st.speaking=st.speaking||[];st.hands=st.hands||[];st.muted=st.muted||[];
  VMUTE=0;VDEAF=0;VHAND=0;VOICE_STATE='connected';
  save();render();toast('Joined '+ch.name,'ok');
}
function leaveVoice(silent){
  if(!VOICE)return;
  const u=me();const st=DB.voice[VOICE];
  if(st){if(u)st.members=st.members.filter(x=>x!==u.id);st.speaking=[];}
  if(MIC_RAF){cancelAnimationFrame(MIC_RAF);MIC_RAF=null;}
  if(MIC_STREAM){MIC_STREAM.getTracks().forEach(t=>t.stop());MIC_STREAM=null;}
  if(AUDIO_CTX){try{AUDIO_CTX.close();}catch(e){}AUDIO_CTX=null;}
  MIC_ANALYSER=null;VOICE_LEVEL=0;
  const name=(DB.channels.find(c=>c.id===VOICE)||{}).name;
  VOICE=null;VOICE_STATE='left';VOICE_ERR=null;save();
  if(!silent){toast('Left '+(name||'voice room'));render();}
}
function tickLevel(){
  if(!MIC_ANALYSER||VOICE_STATE==='left'){MIC_RAF=null;return;}
  const buf=new Uint8Array(MIC_ANALYSER.fftSize);MIC_ANALYSER.getByteTimeDomainData(buf);
  let sum=0;for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;sum+=v*v;}
  VOICE_LEVEL=Math.sqrt(sum/buf.length);
  const speaking=!VMUTE&&VOICE_LEVEL>0.045;
  const st=DB.voice[VOICE];const u=me();
  if(st&&u){const was=st.speaking.includes(u.id);
    if(speaking&&!was)st.speaking.push(u.id);else if(!speaking&&was)st.speaking=st.speaking.filter(x=>x!==u.id);}
  const tile=$('#selfTile');if(tile)tile.classList.toggle('speaking',speaking);
  const m=$('#micLevel');if(m)m.style.width=Math.min(100,Math.round(VOICE_LEVEL*400))+'%';
  MIC_RAF=requestAnimationFrame(tickLevel);
}

function reportModal(target){
  openModal(`<div class="modal-head"><h3>Report a member</h3><button class="btn btn-icon btn-ghost" onclick="closeModal()">${ico('x')}</button></div>
    <div class="modal-body">

    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="rpSend">Send report</button></div>`);
  $('#rpSend').onclick=async()=>{
    const t=$('#rpTarget').value.trim(),r=$('#rpReason').value.trim();
    if(!t||!r){toast('Add the member and a reason','bad');return;}
    const btn=$('#rpSend');btn.disabled=true;btn.textContent='Sending…';
    await new Promise(x=>setTimeout(x,380));
    DB.reports.unshift({id:Date.now(),by:me()?me().username:'Guest',target:t,reason:r,status:'open',sev:'medium',created_at:new Date().toISOString()});
    DB.audit.unshift({id:Date.now(),by:me()?me().username:'Guest',action:'Filed a report on '+t,at:new Date().toISOString()});
    save();closeModal();toast('Report sent to staff','ok');
  };
}

    const form=e.target,btn=$('#recruitBtn'),msg=$('#recruitMsg'),u=me();
    const name=form.name.value.trim(),contact=form.contact.value.trim(),reason=form.reason.value.trim();
    if(!name||!contact||!reason){msg.style.color='var(--accent-2)';msg.textContent='Please fill in your name, contact and reason.';return;}
    if(DB.applications.some(a=>a.contact===contact&&a.status==='pending')){msg.style.color='var(--warn)';msg.textContent='An application with this contact is already pending review.';return;}
    btn.disabled=true;btn.textContent='Submitting…';
    await new Promise(r=>setTimeout(r,420));
    DB.applications.push({id:Date.now(),user_id:u?u.id:null,username:u?u.username:name,name,contact,
      game_id:form.game_id.value,reason,status:'pending',created_at:new Date().toISOString(),decided_by:null});

    msg.style.color='var(--ok)';msg.textContent='Application submitted. You will be notified once it is reviewed.';
    toast('Application submitted','ok');form.reset();
  };
}

function wireLogin(){
  const f=$('#loginForm');if(!f)return;
  f.onsubmit=async e=>{
    e.preventDefault();
    const btn=f.querySelector('button[type=submit]'),msg=$('#lmsg');
    const un=f.username.value.trim(),pw=f.password.value;msg.textContent='';
    if(!un||!pw){msg.textContent='Enter your username and password.';return;}
    const rl=rateLimit('login');
    if(rl.blocked){msg.textContent='Too many attempts. Try again in '+rl.retry+'s.';return;}
    btn.disabled=true;btn.textContent='Signing in…';
    await READY;await new Promise(r=>setTimeout(r,300));
    const u=DB.members.find(m=>m.username.toLowerCase()===un.toLowerCase());
    const h=await hashPw(pw);
    if(!u||u.passwordHash!==h){rateLimit('login',true);msg.textContent='Invalid username or password.';
      btn.disabled=false;btn.textContent='Sign in';return;}
    rateLimit('login',false,true);
    u.status='online';DB.session=u.id;save();
    btn.textContent='Signed in';toast('Welcome back, '+u.username,'ok');
    setTimeout(()=>go('home'),200);
  };
}

/* Route source: hash first (works from file:// and any static host),
   falling back to the real path when served with an SPA rewrite. */
function parse(){
  let raw='';
  if(location.hash&&location.hash.length>1)raw=location.hash.replace(/^#\/?/,'');
  else if(location.pathname&&location.pathname!=='/'&&!/\.html?$/i.test(location.pathname))
    raw=location.pathname.replace(/^\/+/,'');
  const [n,...r]=raw.split('/');
  return [n||'home',r.join('/')];
}

/* important announcement banner — dismissible, keyed by notice id */
function noticeBanner(){
  const n=DB.news.filter(x=>x.pinned).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
  if(!n)return '';
  const u=me();const key=u?u.id:'guest';
  if((DB.dismissed[key]||[]).includes(n.id))return '';
  return `<div class="banner" data-notice="${n.id}" data-notice-key="${esc(String(key))}">${ico('bell')}
    <div class="t"><b>${esc(n.title)}</b><div class="s">${esc((n.body||'').slice(0,140))}</div></div>
    <a class="btn btn-ghost btn-sm" href="#/news/${slugify(n.title)}">Read</a>
    <button class="btn btn-icon btn-ghost" data-notice-x aria-label="Dismiss notice">${ico('x')}</button></div>`;
}
function wireNotice(){
  const b=$('.banner[data-notice]');if(!b)return;
  const key=b.dataset.noticeKey,id=+b.dataset.notice;
  const x=b.querySelector('[data-notice-x]');
  if(x)x.onclick=e=>{e.preventDefault();DB.dismissed[key]=DB.dismissed[key]||[];DB.dismissed[key].push(id);save();b.remove();toast('Notice dismissed');};
}

function paint(param){
  const c=$('#content');
  c.classList.toggle('chat-full',VIEW==='channels'&&!!param);
  c.innerHTML=(ROUTES[VIEW]||ROUTES.home)(param);
  const nb=noticeBanner();
  if(nb)c.insertAdjacentHTML('afterbegin',nb);
  if(!navigator.onLine)c.insertAdjacentHTML('afterbegin','<div class="offline">'+ico('wifi')+'<span>You are offline. Some content may be unavailable.</span></div>');
  c.classList.remove('fade');void c.offsetWidth;c.classList.add('fade');
  renderShell();
  if(WIRES[VIEW])WIRES[VIEW]();
  wireNotice();
  c.scrollTop=0;
}
function errorScreen(e){
  $('#content').innerHTML=`<div class="page">${stateBlock('error',{title:'This page failed to load',msg:'Something went wrong while loading this page.',actions:[{label:'Retry',act:'retry',primary:1},{label:'Go home',act:'home'}]})}</div>`;
  wireActs({retry:()=>render(),home:()=>go('home')});
  renderShell();console.error(e);
}
function render(){
  let [name,param]=parse();
  /* /members/<username> is a profile, not the directory */
  if(name==='members'&&param)name='profile';
  VIEW=ROUTES[name]?name:'home';PARAM=param;
  const showLoading=NAVIGATING&&LOADING_VIEWS.includes(VIEW);
  NAVIGATING=false;
  try{
    if(showLoading){
      $('#content').innerHTML=loadingBlock(VIEW);renderShell();
      setTimeout(()=>{try{paint(param);}catch(e){errorScreen(e);}},320);
    } else paint(param);
  }catch(e){errorScreen(e);}
}

/* ---------- shell wiring ---------- */
window.addEventListener('hashchange',()=>{NAVIGATING=true;render();});
window.addEventListener('offline',()=>{toast('You are offline');
  if(VOICE&&VOICE_STATE==='connected')VOICE_STATE='reconnecting';render();});
window.addEventListener('online',()=>{toast('Back online','ok');
  if(VOICE&&VOICE_STATE==='reconnecting')VOICE_STATE='connected';render();});

/* the Z logo doubles as the menu button on small screens */
const brandEl=$('#brand');
if(brandEl)brandEl.onclick=e=>{
  if(innerWidth<=1000){e.preventDefault();$('#app').classList.toggle('drawer');}
};
$('#drawerBg').onclick=()=>closeDrawer();
window.addEventListener('resize',()=>{if(innerWidth>1000)closeDrawer();});

if(!location.hash)location.hash='#/home';
READY=migratePasswords();
READY.finally(()=>{seedPresence();cleanupPass();render();
  /* background cleanup — never blocks the UI */
  setInterval(backgroundCleanup,15000);
  /* presence + typing expiry */
  setInterval(()=>{
    const key=DB.members.filter(isOnline).map(m=>m.id).join(',');
    if(key!==PRESENCE_KEY){PRESENCE_KEY=key;softRefresh();}
    Object.keys(DB.typing||{}).forEach(c=>{if(isExpired(DB.typing[c].at,TTL.typing))delete DB.typing[c];});
  },10000);
});
let PRESENCE_KEY='';
['click','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,touchPresence,{passive:true}));
</script>
